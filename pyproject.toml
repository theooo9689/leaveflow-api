[project]
name = "leaveflow-api"
version = "0.1.0"
description = "REST API for managing employee leave requests and approval workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0,<1.20.0",
    "fastapi[standard]>=0.115.0,<1.0.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy>=2.0.52,<2.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
